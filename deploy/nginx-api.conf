# ==============================================================================
# Nginx Configuration — Backend API (NestJS)
# Domain: api.mobilehubbd.tech
# Port: 4000
# Note: Initial configuration is HTTP-only (Port 80).
# Run "certbot --nginx -d api.mobilehubbd.tech" to configure HTTPS/SSL.
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name api.mobilehubbd.tech;

    # Maximum upload file size (20M for multi-image uploads)
    client_max_body_size 20M;

    # Logging
    access_log /var/log/nginx/api.mobilehubbd.tech.access.log;
    error_log  /var/log/nginx/api.mobilehubbd.tech.error.log warn;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types application/json text/plain text/css application/javascript image/svg+xml;

    # Direct static file serving for local disk uploads
    # Root /var/www/novamobile serves request /uploads/... directly from /var/www/novamobile/uploads/...
    location /uploads/ {
        root /var/www/novamobile;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        if ($request_method = 'OPTIONS') {
            return 204;
        }
        access_log off;
    }

    # Main API reverse proxy to NestJS
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # Forwarded Client Headers (Essential for trust-proxy & throttler IP detection)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
