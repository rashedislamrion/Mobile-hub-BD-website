# ==============================================================================
# Nginx Configuration — Frontend Web (Next.js)
# Domain: mobilehubbd.tech (with www redirecting to non-www)
# Port: 3000
# Note: Initial configuration is HTTP-only (Port 80).
# Run "certbot --nginx -d mobilehubbd.tech -d www.mobilehubbd.tech" to configure HTTPS/SSL.
# ==============================================================================

# 1. Canonical Redirect: www.mobilehubbd.tech -> mobilehubbd.tech
server {
    listen 80;
    listen [::]:80;
    server_name www.mobilehubbd.tech;

    return 301 http://mobilehubbd.tech$request_uri;
}

# 2. Main Frontend Web Application Server
server {
    listen 80;
    listen [::]:80;
    server_name mobilehubbd.tech;

    # Logging
    access_log /var/log/nginx/mobilehubbd.tech.access.log;
    error_log  /var/log/nginx/mobilehubbd.tech.error.log warn;

    # Gzip Compression for Next.js assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # WebSocket & connection upgrade support for Next.js
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        # Forwarded Client Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
